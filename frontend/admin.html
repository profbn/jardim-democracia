<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Painel de Administração - Jardim Digital</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f9; padding: 40px; }
    .card { background: white; padding: 30px; border-radius: 8px; max-width: 500px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    input, select, textarea, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #1b3d17; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #630d0d; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- Tela de Login -->
  <div id="login-box" class="card">
    <h2>Login do Administrador</h2>
    <form id="form-login">
      <input type="text" id="username" placeholder="Usuário" required />
      <input type="password" id="password" placeholder="Senha" required />
      <button type="submit">Entrar</button>
    </form>
    <p id="login-msg" style="color:red;"></p>
  </div>

  <!-- Formulário de Cadastro Protegido -->
  <div id="admin-box" class="card hidden">
    <h2>Cadastrar Nova Mulher no Jardim</h2>
    <form id="form-cadastrar">
      <input type="text" id="nome" placeholder="Nome Completo" required />
      <input type="text" id="peri" placeholder="Período (Ex: 1900 - 1980)" required />
      <select id="categoria" required>
        <option value="politica">Política</option>
        <option value="educacao">Educação</option>
        <option value="ativismo">Ativismo</option>
        <option value="literatura">Literatura</option>
        <option value="indigena">Povos Indígenas</option>
      </select>
      <input type="color" id="cor" value="#ff0000" required />
      <textarea id="bio" placeholder="Biografia e Trajetória" rows="4" required></textarea>
      <textarea id="feitos" placeholder="Principais Feitos e Legado" rows="4" required></textarea>
      <button type="submit">Cadastrar no Banco</button>
    </form>
    <button onclick="logout()" style="background:#777; margin-top: 20px;">Sair</button>
  </div>

  <script>
    const API_URL = '/api';

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = new URLSearchParams();
      body.append('username', document.getElementById('username').value);
      body.append('password', document.getElementById('password').value);

      const res = await fetch(`${API_URL}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body
      });

      if (res.ok) {
        const data = await res.json();
        localStorage.setItem('token', data.access_token);
        carregarPainel();
      } else {
        document.getElementById('login-msg').innerText = 'Credenciais inválidas!';
      }
    });

    document.getElementById('form-cadastrar').addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = localStorage.getItem('token');
      
      const payload = {
        nome: document.getElementById('nome').value,
        peri: document.getElementById('peri').value,
        categoria: document.getElementById('categoria').value,
        cor: document.getElementById('cor').value,
        bio: document.getElementById('bio').value,
        feitos: document.getElementById('feitos').value
      };

      const res = await fetch(`${API_URL}/mulheres`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        alert('Mulher cadastrada com sucesso!');
        document.getElementById('form-cadastrar').reset();
      } else {
        alert('Erro ao cadastrar. Verifique se sua sessão não expirou.');
      }
    });

    function carregarPainel() {
      if (localStorage.getItem('token')) {
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('admin-box').classList.remove('hidden');
      }
    }

    function logout() {
      localStorage.removeItem('token');
      location.reload();
    }

    carregarPainel();
  </script>
</body>
</html>
